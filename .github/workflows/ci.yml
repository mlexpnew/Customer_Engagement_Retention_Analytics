name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,api,app]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Retrain from scratch (fails below AUC 0.84 or top-10% lift 2.5x)
        run: |
          set +e
          python -m retainlens.train --gate --out ci_model
          code=$?
          cat ci_model/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test the API image
        run: |
          docker build -t retainlens .
          docker run -d -p 8000:8000 --name api retainlens
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
